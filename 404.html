<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없어요 | Sogon Studio</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --ink:#151110; --ink2:#1E1712; --warm:#2B2015; --cream:#F5EBDD; --gold:#D8B568; --soft:#CDC2B2; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Pretendard','Malgun Gothic',sans-serif;
    background:linear-gradient(180deg,var(--ink) 0%,var(--ink2) 50%,var(--warm) 135%);
    color:var(--cream); min-height:100vh; display:flex; align-items:center; justify-content:center;
    text-align:center; word-break:keep-all; line-height:1.7; padding:24px;
  }
  .num { font-size:64px; font-weight:800; color:var(--gold); }
  h1 { font-size:24px; margin:10px 0 8px; }
  p { color:var(--soft); font-size:15px; margin-bottom:26px; }
  .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  a { text-decoration:none; font-weight:700; font-size:15px; border-radius:99px; padding:12px 24px; }
  .gold { background:linear-gradient(135deg,#E7C87E,#C9A24F); color:#241A0C; }
  .line { border:1px solid rgba(216,181,104,.5); color:var(--cream); }
</style>
</head>
<body>
<div>
  <div class="num">404</div>
  <h1>이 길은 아직 나 있지 않아요</h1>
  <p>주소가 바뀌었거나 없는 페이지예요. 홈에서 다시 시작해 보세요.</p>
  <div class="row">
    <a class="gold" href="/">Sogon Studio 홈</a>
    <a class="line" href="/iljoo.html">무료 일주 계산기</a>
  </div>
</div>
</body>
</html>
